name: Online Secretary OS CI
on:
  pull_request:
    paths:
      - 'ail-unified-intake/**'
      - '.github/workflows/online-secretary-ci.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ail-unified-intake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ail-unified-intake/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit and safety tests
        run: npm test
      - name: Anonymous rehearsal
        run: npm run rehearsal
